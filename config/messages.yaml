photo.what: 'Take a photo of: {what}'
photo.required: A photo is required for this kind of damage.
photo.skip: Skip the photo

# --- Photo of the label
label.title: Let's identify the device
label.subtitle: Take a photo of the sticker with the asset tag or serial number. It's usually on the bottom of a laptop, the back of a monitor, or in Settings on a phone.
