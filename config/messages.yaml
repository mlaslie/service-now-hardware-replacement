# Remove a line to use the built-in default. Check: uv run python -m app.messages

# --- First turn: desktop or mobile
display.ask: |-
  Are you on the Gemini Enterprise Desktop or Mobile App?

  1 = Mobile App

  2 = Desktop/Browser
text.reply_hint: Reply with a number, or just type your answer.

