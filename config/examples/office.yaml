# Example organization profile for a typical office: no medical equipment, shared equipment is
# printers, conference-room displays and docking stations. Copy to config/organization.yaml and edit.
# Every field is explained in docs/CONFIGURATION.md.

organization: Example Corp

agent:
  name: Hardware Help
  persona: >-
    You are the Hardware Help assistant. You help Example Corp employees report broken or failing
    work hardware in as few taps as possible, and follow up on it: their own devices (laptop, phone,
    monitor), which are replaced, and shared office equipment (printers, conference-room displays),
    which is repaired on site. Use plain, friendly language and never IT jargon.
  description: >-
    Report a broken laptop, phone, monitor or shared office equipment in a sentence or a photo,
    and ask "any update?" at any time. I find the device, check it with you and file the
    request with IT.
  skill_name: Hardware repair and replacement
  skill_description: Report broken work hardware and follow up on the ticket.
  examples:
    - My laptop screen is cracked
    - The printer on floor 3 keeps jamming
    - Any update on my ticket?

branding:
  primary_color: "#1A56DB"

servicenow:
  ticket_category: hardware
  asset_tables: [alm_hardware]

devices:
  clinical_categories: []
  asset_tag_hint: a company sticker with a barcode and a short number, e.g. IT-01234
  refresh_years: {laptop: 4, desktop: 5, monitor: 6, phone: 3, tablet: 4}
  default_refresh_years: 4

issues:
  personal:
    - {key: cracked_screen, label: Cracked or broken screen, photo: required,
       photo_of: "the screen, switched on if possible, so the cracks are visible",
       min_urgency: high, replace: true}
    - {key: wont_power_on, label: Won't turn on, min_urgency: high, replace: true}
    - {key: battery, label: Battery or charging, photo: recommended,
       photo_of: "the underside of the device"}
    - {key: keyboard_trackpad, label: Keyboard or trackpad, photo: recommended,
       photo_of: "the keyboard, showing the broken or missing keys"}
    - {key: performance, label: Slow or freezing,
       recommendation: "Remote diagnostics first; replace if unresolved"}
    - {key: other, label: Something else, photo: optional, photo_of: "whatever shows the problem"}
  equipment:
    - {key: not_working, label: Not working, min_urgency: high}
    - {key: error_alarm, label: Error message, photo: recommended,
       photo_of: "the screen or panel showing the error"}
    - {key: damaged, label: Damaged or broken part, photo: recommended,
       photo_of: "the damaged part"}
    - {key: safety_concern, label: Safety concern, min_urgency: critical, safety: true}
    - {key: other, label: Something else, photo: optional, photo_of: "whatever shows the problem"}

service:
  personal_response_targets: {"1": Same day, "2": Next business day, "3": 2-3 business days, "4": Within a week}
  equipment_response_targets: {"1": Within 2 hours, "2": Same day, "3": Next business day, "4": Within 3 business days}
  safety_text: >-
    If it is safe to do so, unplug it and keep people away from it. If anyone was hurt, also tell
    your manager and facilities.
